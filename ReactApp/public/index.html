  <head>

    <!-- favicon.svg is the app's real icon (2026-09-18) - favicon.ico/logo192.png/
         logo512.png were referenced here by the original Create-React-App
         template but never actually existed in public/, so every browser was
         falling back to a generic icon. Browsers show a bookmark's icon from
         the favicon of the page you dragged the link FROM (not the
         bookmarklet's own javascript: URL, which has no site of its own to
         fetch one from), so this is also what makes the "<Sale> Filler"
         bookmark show a proper icon in the bookmarks bar. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b1f6b" />

      name="description"
      content="Bus Wankers Autofill Downloads"
    />

    <title>Bus Wankers Autofill Downloads</title>
  </head>
